name: Deploy to IONOS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Cache-bust CSS/JS references
        run: |
          SHA="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './backups/*' -not -path './.git/*' -print0 | \
            xargs -0 sed -i \
              -e "s/=\"style\.css\"/=\"style.css?v=$SHA\"/g" \
              -e "s/=\"\.\.\/style\.css\"/=\"..\/style.css?v=$SHA\"/g" \
              -e "s/=\"script\.js\"/=\"script.js?v=$SHA\"/g" \
              -e "s/=\"\.\.\/script\.js\"/=\"..\/script.js?v=$SHA\"/g"

      - name: Deploy via SFTP
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes;
          set net:max-retries 3;
          open -u su206610,$SFTP_PASSWORD sftp://access-5020198099.webspace-host.com:22;
          mirror --reverse --verbose \
            --exclude='^\.git/' \
            --exclude='^\.github/' \
            --exclude='^backups/' \
            --exclude='^CLAUDE\.md$' \
            --exclude='^ANALYTICS_SETUP\.md$' \
            ./ /public/
          "
